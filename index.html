<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPAS AI 應用規劃師 高密度考點圖卡線上學習庫</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Fira+Code:wght@500;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0f19;
      color: #f8fafc;
      font-family: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 40px;
    }

    /* Top Nav Control Bar */
    header {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 24px;
    }

    .top-nav {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #0f172a;
      font-weight: 900;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    .app-title {
      font-size: 16px;
      font-weight: 700;
      color: #f1f5f9;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .level-select, .category-select, .search-input {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }

    .level-select:focus, .category-select:focus, .search-input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }

    .search-input {
      min-width: 200px;
    }

    .btn-nav {
      background: #334155;
      color: #f8fafc;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-nav:hover {
      background: #475569;
    }

    .btn-nav:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    main {
      max-width: 1400px;
      margin: 20px auto;
      padding: 0 24px;
      width: 100%;
      flex: 1;
    }

    .progress-bar-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      background: #1e293b;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
    }

    .card-counter {
      font-weight: 700;
      color: #38bdf8;
    }

    .hint-text {
      color: #94a3b8;
      font-size: 13px;
    }

    /* Bento Grid Flashcard Styles */
    .bento-card {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 16px;
    }

    .card-id-tag {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      font-weight: 800;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 6px;
      font-family: 'Fira Code', monospace;
    }

    .card-category-tag {
      background: rgba(168, 85, 247, 0.15);
      color: #c084fc;
      font-weight: 700;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 6px;
    }

    .card-main-title {
      font-size: 22px;
      font-weight: 900;
      color: #f8fafc;
      margin-top: 8px;
    }

    .card-badge-right {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0f172a;
      font-size: 12px;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 20px;
    }

    .card-body-wrapper {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
    }

    @media (max-width: 1024px) {
      .card-body-wrapper {
        grid-template-columns: 1fr;
      }
    }

    .card-sidebar {
      background: #1e293b;
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
    }

    .sidebar-desc {
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 12px;
    }

    .capsule-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }

    .capsule-tag {
      background: #334155;
      color: #e2e8f0;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
    }

    .sidebar-checklist {
      background: #0f172a;
      border-radius: 8px;
      padding: 12px;
      font-size: 12px;
    }

    .checklist-head {
      color: #38bdf8;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .checklist-row {
      color: #94a3b8;
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .sidebar-flow {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      color: #34d399;
      font-weight: 700;
      font-size: 12px;
      padding: 10px;
      border-radius: 8px;
    }

    .card-grid-6 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, minmax(180px, auto));
      gap: 14px;
    }

    @media (max-width: 768px) {
      .card-grid-6 {
        grid-template-columns: 1fr;
      }
    }

    .grid-block {
      background: #1e293b;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .block-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .block-badge-num {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 900;
      color: #0f172a;
      flex-shrink: 0;
    }

    .num-1 { background: #38bdf8; }
    .num-2 { background: #c084fc; }
    .num-3 { background: #f43f5e; }
    .num-4 { background: #fbbf24; }
    .num-5 { background: #34d399; }
    .num-6 { background: #fb923c; }

    .block-h-title {
      font-size: 14px;
      font-weight: 700;
      color: #f1f5f9;
    }

    .block-h-sub {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 10px;
    }

    .ui-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
      margin-bottom: 8px;
    }

    .ui-table th {
      background: #0f172a;
      color: #38bdf8;
      text-align: left;
      padding: 6px;
      border: 1px solid #334155;
    }

    .ui-table td {
      padding: 6px;
      border: 1px solid #334155;
      color: #cbd5e1;
    }

    .analogy-box {
      background: rgba(245, 158, 11, 0.1);
      border-left: 3px solid #f59e0b;
      padding: 8px 10px;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    .analogy-title {
      font-weight: 700;
      color: #fbbf24;
      font-size: 12px;
      margin-bottom: 4px;
    }

    .analogy-desc {
      font-size: 11px;
      color: #cbd5e1;
      line-height: 1.5;
    }

    .code-box {
      background: #090d16;
      color: #a5f3fc;
      font-family: 'Fira Code', monospace;
      font-size: 10px;
      padding: 8px;
      border-radius: 6px;
      white-space: pre-wrap;
      word-break: break-all;
      margin-bottom: 8px;
    }

    .tips-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 8px;
    }

    .tip-item {
      font-size: 11px;
      color: #cbd5e1;
      background: #0f172a;
      padding: 6px;
      border-radius: 4px;
    }

    .block-list-item {
      font-size: 11px;
      color: #cbd5e1;
      margin-bottom: 4px;
    }

    .block-focus-box {
      background: #0f172a;
      color: #38bdf8;
      font-size: 11px;
      font-weight: 600;
      padding: 6px 8px;
      border-radius: 6px;
      margin-top: 8px;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    footer {
      text-align: center;
      font-size: 12px;
      color: #64748b;
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body>

  <header>
    <div class="top-nav">
      <div class="logo-area">
        <span class="logo-badge">iPAS AI</span>
        <span class="app-title">應用規劃師 高密度考點圖卡線上學習庫</span>
      </div>

      <div class="controls">
        <!-- 選擇 Level -->
        <label for="levelSelect" style="font-size:12px; font-weight:700; color:#38bdf8; display:flex; align-items:center; gap:4px;">
          🎴 選擇卡片庫：
        </label>
        <select class="level-select" id="levelSelect" style="font-weight:700; background:#0f172a; color:#38bdf8; border:1px solid #38bdf8;">
          <option value="junior">📘 初級 (Junior) 22 張圖卡</option>
          <option value="mid">📙 中級 (Mid-Level) 24 張圖卡</option>
          <option value="adv">🚀 進階強效 (5 大主題包) 30 張圖卡</option>
        </select>

        <!-- 選擇 分類 -->
        <select class="category-select" id="categorySelect">
          <option value="ALL">🌐 全部分類單元</option>
        </select>

        <!-- 搜尋 -->
        <input type="text" class="search-input" id="searchInput" placeholder="🔍 搜尋關鍵字 (如 RAG, LoRA)">

        <!-- 模式切換按鈕 (圖片 vs 互動 Grid) -->
        <button class="btn-nav" id="btnToggleMode" style="background:#0284c7; color:#ffffff; font-weight:700; border:1px solid #38bdf8; padding:6px 12px;" onclick="toggleViewMode()">
          🖼️ 切換 2K 高清照片模式
        </button>

        <!-- 上下一張按鈕 -->
        <button class="btn-nav" id="btnPrev" onclick="prevCard()">◀ 上一張</button>
        <button class="btn-nav" id="btnNext" onclick="nextCard()">下一張 ▶</button>
      </div>
    </div>
  </header>

  <main>
    <div class="progress-bar-area">
      <div class="card-counter" id="cardCounter">圖卡 1 / 22 (CARD 01)</div>
      <div class="hint-text">💡 提示：可使用鍵盤 <b>←</b> 與 <b>→</b> 左右方向鍵快速翻頁刷題</div>
    </div>

    <div id="cardContainer">
      <!-- 渲染 Bento Grid 卡片或 PNG 圖片 -->
    </div>
  </main>

  <footer>
    Antigravity Agent OS 開發 | 內容依據 iPAS 官方考試大綱與歷屆 300 題考點編製 | 創用 CC BY-NC-SA 4.0 授權
  </footer>

  <!-- 引入內置全備份資料庫，保證 file:// 協議與離線環境下 100% 可存取 -->
  <script src="cards_bundle.js"></script>
  <script>
    let allCards = [];
    let filteredCards = [];
    let currentIndex = 0;
    let currentLevel = 'junior';
    let currentViewMode = 'grid'; // 'grid' or 'image'

    const levelFiles = {
      'junior': 'junior_cards_data.json',
      'mid': 'mid_cards_data.json',
      'adv': 'adv_cards_data.json'
    };

    // 初始化與切換 Level
    document.getElementById('levelSelect').addEventListener('change', (e) => {
      currentLevel = e.target.value;
      loadLevelData(currentLevel);
    });

    // 模式切換函數 (Grid vs Image)
    function toggleViewMode() {
      currentViewMode = (currentViewMode === 'grid') ? 'image' : 'grid';
      const btn = document.getElementById('btnToggleMode');
      if (currentViewMode === 'image') {
        btn.innerHTML = '💻 切換互動 Bento Grid 模式';
        btn.style.background = '#8b5cf6';
      } else {
        btn.innerHTML = '🖼️ 切換 2K 高清照片模式';
        btn.style.background = '#0284c7';
      }
      renderCurrentCard();
    }

    function loadLevelData(level) {
      const fallbackMap = {
        'junior': window.JUNIOR_CARDS,
        'mid': window.MID_CARDS,
        'adv': window.ADV_CARDS
      };

      // 1. 若為 file:// 協議本機開啟，直接使用內嵌數據，100% 免 fetch、免報錯！
      if (window.location.protocol === 'file:') {
        const data = fallbackMap[level] || [];
        initCardData(data);
        return;
      }

      // 2. 若為 http/https 網路環境，嘗試執行帶 Cache-Busting 之 fetch
      const jsonFile = levelFiles[level];
      const cacheBustUrl = `${jsonFile}?v=${Date.now()}`;
      fetch(cacheBustUrl)
        .then(res => {
          if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.statusText}`);
          return res.json();
        })
        .then(data => initCardData(data))
        .catch(err => {
          console.warn(`Fetch failed (${err.message}). Activating embedded fallback dataset for ${level}...`);
          const fallbackData = fallbackMap[level];
          if (fallbackData && fallbackData.length > 0) {
            initCardData(fallbackData);
          } else {
            console.error('Fatal: Both fetch and fallback failed for level:', level);
            document.getElementById('cardContainer').innerHTML = `<div style="color:#ef4444; padding:40px; text-align:center; font-size:16px;">⚠️ 無法載入圖卡資料庫 ${jsonFile} (${err.message})<br><br><button onclick="loadLevelData('${level}')" style="padding:8px 16px; background:#38bdf8; color:#0f172a; border:none; border-radius:6px; font-weight:700; cursor:pointer;">🔄 重新嘗試載入</button></div>`;
          }
        });
    }

    function initCardData(data) {
      allCards = data;
      updateCategoryOptions();
      filteredCards = [...allCards];
      currentIndex = 0;
      renderCurrentCard();
    }

    // 動態更新分類選單
    function updateCategoryOptions() {
      const catSelect = document.getElementById('categorySelect');
      const categories = Array.from(new Set(allCards.map(c => c.category)));
      catSelect.innerHTML = '<option value="ALL">🌐 全部分類單元</option>';
      categories.forEach(cat => {
        catSelect.innerHTML += `<option value="${cat}">${cat}</option>`;
      });
    }

    // 搜尋與過濾
    document.getElementById('searchInput').addEventListener('input', filterCards);
    document.getElementById('categorySelect').addEventListener('change', filterCards);

    function filterCards() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const cat = document.getElementById('categorySelect').value;

      filteredCards = allCards.filter(card => {
        const matchSearch = card.title.toLowerCase().includes(search) || 
                            card.category.toLowerCase().includes(search) ||
                            (card.desc && card.desc.toLowerCase().includes(search)) ||
                            (card.capsules && card.capsules.some(c => c.toLowerCase().includes(search)));
        const matchCat = (cat === 'ALL') || card.category === cat;
        return matchSearch && matchCat;
      });

      currentIndex = 0;
      renderCurrentCard();
    }

    function prevCard() {
      if (currentIndex > 0) {
        currentIndex--;
        renderCurrentCard();
      }
    }

    function nextCard() {
      if (currentIndex < filteredCards.length - 1) {
        currentIndex++;
        renderCurrentCard();
      }
    }

    // 鍵盤左右鍵翻頁
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
      if (e.key === 'ArrowLeft') prevCard();
      if (e.key === 'ArrowRight') nextCard();
    });

    // 渲染卡片
    function renderCurrentCard() {
      const container = document.getElementById('cardContainer');
      const counter = document.getElementById('cardCounter');
      const btnPrev = document.getElementById('btnPrev');
      const btnNext = document.getElementById('btnNext');

      if (filteredCards.length === 0) {
        container.innerHTML = '<div style="color:#94a3b8; padding:60px; text-align:center; font-size:16px;">🔍 沒有找到符合條件的考點圖卡</div>';
        counter.innerText = '0 / 0';
        btnPrev.disabled = true;
        btnNext.disabled = true;
        return;
      }

      const card = filteredCards[currentIndex];
      const levelLabel = currentLevel === 'junior' ? '📘 初級' : (currentLevel === 'mid' ? '📙 中級' : '🚀 進階強效');
      counter.innerText = `${levelLabel} 圖卡 ${currentIndex + 1} / ${filteredCards.length} (${card.id}) [${currentViewMode === 'image' ? '🖼️ 圖片模式' : '💻 互動 Grid'}]`;
      btnPrev.disabled = (currentIndex === 0);
      btnNext.disabled = (currentIndex === filteredCards.length - 1);

      // 1. 🖼️ 高清照片模式
      if (currentViewMode === 'image') {
        const pngPath = card.png_path || `cards_png/${currentLevel}/${currentLevel}_bento_card_01.png`;

        container.innerHTML = `
          <div style="background:#0f172a; border:1px solid rgba(255,255,255,0.1); border-radius:16px; padding:24px; text-align:center; box-shadow:0 20px 25px -5px rgba(0,0,0,0.5);">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px;">
              <div style="text-align:left;">
                <span class="card-id-tag">${card.id}</span>
                <span class="card-category-tag" style="margin-left:8px;">${card.category}</span>
                <span style="font-size:18px; font-weight:700; color:#f8fafc; margin-left:12px; display:inline-block;">${card.title}</span>
              </div>
              <a href="${pngPath}" download="${card.id}_${card.title}.png" style="padding:8px 16px; background:#10b981; color:#fff; font-weight:700; border-radius:8px; text-decoration:none; display:inline-flex; align-items:center; gap:6px;">
                📥 下載此 2K 高清照片
              </a>
            </div>
            
            <div style="overflow:hidden; border-radius:12px; background:#020617; border:1px solid #1e293b;">
              <a href="${pngPath}" target="_blank" title="點擊在新分頁開啟 2K 原圖照片">
                <img src="${pngPath}" alt="${card.title}" style="width:100%; height:auto; display:block; max-height:800px; object-fit:contain; cursor:zoom-in;">
              </a>
            </div>
            <div style="color:#94a3b8; font-size:13px; margin-top:12px;">💡 提示：點擊上方圖片可在新分頁放大檢視 2K 原始解析度照片，或點擊綠色按鈕下載圖片存入相簿。</div>
          </div>
        `;
        return;
      }

      // 2. 💻 互動 Bento Grid 模式
      let capsulesHTML = '';
      if (card.capsules) {
        capsulesHTML = card.capsules.map(c => `<span class="capsule-tag">${c}</span>`).join('');
      }

      let checklistHTML = '';
      if (card.checklist) {
        checklistHTML = card.checklist.map(c => `<div class="checklist-row">✓ ${c}</div>`).join('');
      }

      let blocksHTML = '';
      card.bento_blocks.forEach(block => {
        let contentHTML = '';

        if (block.type === 'table') {
          let headersHTML = block.headers.map(h => `<th>${h}</th>`).join('');
          let rowsHTML = block.rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('');
          contentHTML = `<table class="ui-table"><thead><tr>${headersHTML}</tr></thead><tbody>${rowsHTML}</tbody></table>`;
        } else if (block.type === 'analogy') {
          contentHTML = `
            <div class="analogy-box">
              <div class="analogy-title">${block.analogy_title || '生活化比喻'}</div>
              <div class="analogy-desc">${block.analogy_desc}</div>
            </div>
          `;
        } else if (block.type === 'compare') {
          let headersHTML = block.headers.map(h => `<th>${h}</th>`).join('');
          let rowsHTML = block.rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('');
          contentHTML = `<table class="ui-table"><thead><tr>${headersHTML}</tr></thead><tbody>${rowsHTML}</tbody></table>`;
        } else if (block.type === 'code') {
          contentHTML = `<div class="code-box">${block.code_snippet}</div>`;
        } else if (block.type === 'tips') {
          contentHTML = `<div class="tips-list">${block.tips_list.map(t => `<div class="tip-item">${t}</div>`).join('')}</div>`;
        } else if (block.type === 'list' && block.items) {
          contentHTML = block.items.map(item => `<div class="block-list-item">${item}</div>`).join('');
        } else if (block.items) {
          contentHTML = block.items.map(item => `<div class="block-list-item">${item}</div>`).join('');
        }

        blocksHTML += `
          <div class="grid-block">
            <div>
              <div class="block-head">
                <span class="block-badge-num ${block.color || 'num-1'}">${block.num}</span>
                <span class="block-h-title">${block.title}</span>
              </div>
              <div class="block-h-sub">${block.sub || ''}</div>
              ${contentHTML}
            </div>
            <div class="block-focus-box">${block.focus}</div>
          </div>
        `;
      });

      container.innerHTML = `
        <div class="bento-card">
          <!-- Top Header -->
          <div class="card-top">
            <div>
              <div style="display:flex; align-items:center; gap:8px; margin-bottom:4px;">
                <span class="card-id-tag">${card.id}</span>
                <span class="card-category-tag">${card.category}</span>
              </div>
              <div class="card-main-title">${card.title}</div>
            </div>
            <div class="card-badge-right">${card.badge_tag || 'iPAS 核心考點'}</div>
          </div>

          <!-- Body Wrapper -->
          <div class="card-body-wrapper">
            <!-- Sidebar -->
            <div class="card-sidebar">
              <div>
                <div class="sidebar-desc">${card.desc}</div>
                
                <div style="font-size:12px; font-weight:700; color:#38bdf8; margin-bottom:8px;">🔑 關鍵詞標籤</div>
                <div class="capsule-grid">${capsulesHTML}</div>

                <div class="sidebar-checklist">
                  <div class="checklist-head">🎯 學習與考試 Checkpoint</div>
                  ${checklistHTML}
                </div>
              </div>

              <div>
                <div class="sidebar-flow">🔄 核心流程：${card.flow ? card.flow[0] : '觀念對齊 ➔ 機制理解 ➔ 題目秒解'}</div>
              </div>
            </div>

            <!-- 6 Grid Blocks -->
            <div class="card-grid-6">
              ${blocksHTML}
            </div>
          </div>
        </div>
      `;
    }

    // 啟動預設載入初級資料
    loadLevelData('junior');
  </script>
</body>
</html>
