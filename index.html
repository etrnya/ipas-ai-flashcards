<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPAS AI 應用規劃師 高密度考點圖卡線上學習庫</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@600;700;800&family=Fira+Code:wght@400;500;700&display=swap');
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Noto Sans TC', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 頂部 Header & 導覽列 */
    header {
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .top-nav {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 14px;
      padding: 4px 12px;
      border-radius: 8px;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
    }

    .app-title {
      font-size: 18px;
      font-weight: 900;
      background: linear-gradient(90deg, #38bdf8 0%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* 控制控制項 (等級 + 搜尋 + 篩選) */
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .level-select, .category-select {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #38bdf8;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      outline: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .level-select:hover, .category-select:hover {
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
    }

    .search-input {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      outline: none;
      width: 180px;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
      width: 220px;
    }

    .btn-nav {
      background: #334155;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-nav:hover:not(:disabled) {
      background: #0284c7;
      border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }

    .btn-nav:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* 主要容器 */
    main {
      max-width: 1400px;
      margin: 16px auto;
      padding: 0 16px;
      flex: 1;
      width: 100%;
    }

    /* 切換進度資訊條 */
    .progress-bar-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      background: rgba(30, 41, 59, 0.6);
      padding: 10px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .card-counter {
      font-size: 14px;
      font-weight: 700;
      color: #38bdf8;
    }

    .hint-text {
      font-size: 12px;
      color: #94a3b8;
    }

    /* Bento 網格卡片容器 */
    .bento-card {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card-top {
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 12px;
    }

    .card-id-tag {
      background: #38bdf8;
      color: #0f172a;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 6px;
    }

    .card-category-tag {
      background: rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 6px;
    }

    .card-badge-right {
      background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
    }

    .card-main-title {
      font-size: 24px;
      font-weight: 900;
      color: #f8fafc;
      margin-top: 8px;
    }

    /* 卡片主體 Layout */
    .card-body-wrapper {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
    }

    @media (max-width: 1024px) {
      .card-body-wrapper {
        grid-template-columns: 1fr;
      }
    }

    /* 左側 Sidebar */
    .card-sidebar {
      background: rgba(30, 41, 59, 0.6);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
    }

    .sidebar-desc {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.6;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 14px;
      margin-bottom: 14px;
    }

    .capsule-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }

    .capsule-tag {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      word-break: break-word;
    }

    .sidebar-checklist {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .checklist-head {
      font-size: 13px;
      font-weight: 700;
      color: #fbbf24;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .checklist-row {
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.5;
      background: rgba(15, 23, 42, 0.5);
      padding: 8px 12px;
      border-radius: 8px;
      border-left: 3px solid #fbbf24;
    }

    .sidebar-flow {
      background: rgba(2, 132, 199, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.5;
    }

    /* 右側 6 Bento Grid Blocks */
    .card-grid-6 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    @media (max-width: 1200px) {
      .card-grid-6 {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 768px) {
      .card-grid-6 {
        grid-template-columns: 1fr;
      }
    }

    .grid-block {
      background: rgba(30, 41, 59, 0.7);
      border-radius: 14px;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      transition: all 0.2s;
    }

    .grid-block:hover {
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .block-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .block-badge-num {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 12px;
      color: #fff;
      flex-shrink: 0;
    }

    .num-1 { background: #3b82f6; }
    .num-2 { background: #10b981; }
    .num-3 { background: #f59e0b; }
    .num-4 { background: #ec4899; }
    .num-5 { background: #8b5cf6; }
    .num-6 { background: #06b6d4; }

    .block-h-title {
      font-size: 15px;
      font-weight: 800;
      color: #f8fafc;
    }

    .block-h-sub {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 10px;
    }

    /* 表格樣式 */
    .ui-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .ui-table th {
      background: rgba(15, 23, 42, 0.8);
      color: #38bdf8;
      padding: 6px 8px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .ui-table td {
      padding: 6px 8px;
      color: #cbd5e1;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      line-height: 1.4;
    }

    /* 比喻卡片樣式 */
    .analogy-box {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
    }

    .analogy-title {
      font-size: 13px;
      font-weight: 800;
      color: #fbbf24;
      margin-bottom: 4px;
    }

    .analogy-desc {
      font-size: 12px;
      color: #e2e8f0;
      line-height: 1.5;
    }

    /* 程式碼區塊樣式 */
    .code-box {
      background: #090d16;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 10px;
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      color: #38bdf8;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-all;
      margin-bottom: 8px;
      overflow-x: auto;
    }

    /* 陷阱解析列表 */
    .tips-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 8px;
    }

    .tip-item {
      font-size: 12px;
      color: #cbd5e1;
      line-height: 1.5;
      background: rgba(15, 23, 42, 0.5);
      padding: 6px 10px;
      border-radius: 6px;
    }

    .block-list-item {
      font-size: 12px;
      color: #cbd5e1;
      line-height: 1.5;
      padding: 4px 0;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.05);
    }

    .block-focus-box {
      background: rgba(15, 23, 42, 0.9);
      border-left: 3px solid #38bdf8;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      color: #38bdf8;
      border-radius: 0 6px 6px 0;
      margin-top: 6px;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #64748b;
      font-size: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    footer a {
      color: #38bdf8;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="top-nav">
      <div class="logo-area">
        <span class="logo-badge">iPAS AI</span>
        <span class="app-title">應用規劃師 高密度考點圖卡線上學習庫</span>
      </div>

      <div class="controls">
        <!-- 選擇 Level -->
        <select class="level-select" id="levelSelect">
          <option value="junior">📘 初級 (Junior) 22 張圖卡</option>
          <option value="mid">📙 中級 (Mid-Level) 24 張圖卡</option>
        </select>

        <!-- 選擇 分類 -->
        <select class="category-select" id="categorySelect">
          <option value="ALL">🌐 全部分類單元</option>
        </select>

        <!-- 搜尋 -->
        <input type="text" class="search-input" id="searchInput" placeholder="🔍 搜尋關鍵字 (如 RAG, LoRA)">

        <!-- 上下一張按鈕 -->
        <button class="btn-nav" id="btnPrev" onclick="prevCard()">◀ 上一張</button>
        <button class="btn-nav" id="btnNext" onclick="nextCard()">下一張 ▶</button>
      </div>
    </div>
  </header>

  <main>
    <div class="progress-bar-area">
      <div class="card-counter" id="cardCounter">圖卡 1 / 22 (CARD 01)</div>
      <div class="hint-text">💡 提示：可使用鍵盤 <b>←</b> 與 <b>→</b> 左右方向鍵快速翻頁刷題</div>
    </div>

    <div id="cardContainer">
      <!-- 渲染 Bento Grid 卡片 -->
    </div>
  </main>

  <footer>
    Antigravity Agent OS 開發 | 內容依據 iPAS 官方考試大綱與歷屆 300 題考點編製 | 創用 CC BY-NC-SA 4.0 授權
  </footer>

  <script>
    let allCards = [];
    let filteredCards = [];
    let currentIndex = 0;
    let currentLevel = 'junior';

    const levelFiles = {
      'junior': 'junior_cards_data.json',
      'mid': 'mid_cards_data.json'
    };

    // 初始化與切換 Level
    document.getElementById('levelSelect').addEventListener('change', (e) => {
      currentLevel = e.target.value;
      loadLevelData(currentLevel);
    });

    function loadLevelData(level) {
      const jsonFile = levelFiles[level];
      fetch(jsonFile)
        .then(res => res.json())
        .then(data => {
          allCards = data;
          updateCategoryOptions();
          filteredCards = [...allCards];
          currentIndex = 0;
          renderCurrentCard();
        })
        .catch(err => {
          console.error('Error loading cards:', err);
          document.getElementById('cardContainer').innerHTML = `<div style="color:#ef4444; padding:40px; text-align:center;">⚠️ 無法載入圖卡資料庫 ${jsonFile}</div>`;
        });
    }

    // 動態更新分類選單
    function updateCategoryOptions() {
      const catSelect = document.getElementById('categorySelect');
      const categories = Array.from(new Set(allCards.map(c => c.category)));
      catSelect.innerHTML = '<option value="ALL">🌐 全部分類單元</option>';
      categories.forEach(cat => {
        catSelect.innerHTML += `<option value="${cat}">${cat}</option>`;
      });
    }

    // 搜尋與過濾
    document.getElementById('searchInput').addEventListener('input', filterCards);
    document.getElementById('categorySelect').addEventListener('change', filterCards);

    function filterCards() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const cat = document.getElementById('categorySelect').value;

      filteredCards = allCards.filter(card => {
        const matchSearch = card.title.toLowerCase().includes(search) || 
                            card.category.toLowerCase().includes(search) ||
                            (card.desc && card.desc.toLowerCase().includes(search)) ||
                            (card.capsules && card.capsules.some(c => c.toLowerCase().includes(search)));
        const matchCat = (cat === 'ALL') || card.category === cat;
        return matchSearch && matchCat;
      });

      currentIndex = 0;
      renderCurrentCard();
    }

    function prevCard() {
      if (currentIndex > 0) {
        currentIndex--;
        renderCurrentCard();
      }
    }

    function nextCard() {
      if (currentIndex < filteredCards.length - 1) {
        currentIndex++;
        renderCurrentCard();
      }
    }

    // 鍵盤左右鍵翻頁
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
      if (e.key === 'ArrowLeft') prevCard();
      if (e.key === 'ArrowRight') nextCard();
    });

    // 渲染卡片
    function renderCurrentCard() {
      const container = document.getElementById('cardContainer');
      const counter = document.getElementById('cardCounter');
      const btnPrev = document.getElementById('btnPrev');
      const btnNext = document.getElementById('btnNext');

      if (filteredCards.length === 0) {
        container.innerHTML = '<div style="color:#94a3b8; padding:60px; text-align:center; font-size:16px;">🔍 沒有找到符合條件的考點圖卡</div>';
        counter.innerText = '0 / 0';
        btnPrev.disabled = true;
        btnNext.disabled = true;
        return;
      }

      const card = filteredCards[currentIndex];
      counter.innerText = `${currentLevel === 'junior' ? '📘 初級' : '📙 中級'} 圖卡 ${currentIndex + 1} / ${filteredCards.length} (${card.id})`;
      btnPrev.disabled = (currentIndex === 0);
      btnNext.disabled = (currentIndex === filteredCards.length - 1);

      // 構建 Capsules HTML
      let capsulesHTML = '';
      if (card.capsules) {
        capsulesHTML = card.capsules.map(c => `<span class="capsule-tag">${c}</span>`).join('');
      }

      // 構建 Checklist HTML
      let checklistHTML = '';
      if (card.checklist) {
        checklistHTML = card.checklist.map(c => `<div class="checklist-row">✓ ${c}</div>`).join('');
      }

      // 構建 6 個 Bento Blocks
      let blocksHTML = '';
      card.bento_blocks.forEach(block => {
        let contentHTML = '';

        if (block.type === 'table') {
          let headersHTML = block.headers.map(h => `<th>${h}</th>`).join('');
          let rowsHTML = block.rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('');
          contentHTML = `<table class="ui-table"><thead><tr>${headersHTML}</tr></thead><tbody>${rowsHTML}</tbody></table>`;
        } else if (block.type === 'analogy') {
          contentHTML = `
            <div class="analogy-box">
              <div class="analogy-title">${block.analogy_title || '生活化比喻'}</div>
              <div class="analogy-desc">${block.analogy_desc}</div>
            </div>
          `;
        } else if (block.type === 'compare') {
          let headersHTML = block.headers.map(h => `<th>${h}</th>`).join('');
          let rowsHTML = block.rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('');
          contentHTML = `<table class="ui-table"><thead><tr>${headersHTML}</tr></thead><tbody>${rowsHTML}</tbody></table>`;
        } else if (block.type === 'code') {
          contentHTML = `<div class="code-box">${block.code_snippet}</div>`;
        } else if (block.type === 'tips') {
          contentHTML = `<div class="tips-list">${block.tips_list.map(t => `<div class="tip-item">${t}</div>`).join('')}</div>`;
        } else if (block.type === 'list' && block.items) {
          contentHTML = block.items.map(item => `<div class="block-list-item">${item}</div>`).join('');
        } else if (block.items) {
          contentHTML = block.items.map(item => `<div class="block-list-item">${item}</div>`).join('');
        }

        blocksHTML += `
          <div class="grid-block">
            <div>
              <div class="block-head">
                <span class="block-badge-num ${block.color || 'num-1'}">${block.num}</span>
                <span class="block-h-title">${block.title}</span>
              </div>
              <div class="block-h-sub">${block.sub || ''}</div>
              ${contentHTML}
            </div>
            <div class="block-focus-box">${block.focus}</div>
          </div>
        `;
      });

      container.innerHTML = `
        <div class="bento-card">
          <!-- Top Header -->
          <div class="card-top">
            <div>
              <div style="display:flex; align-items:center; gap:8px; margin-bottom:4px;">
                <span class="card-id-tag">${card.id}</span>
                <span class="card-category-tag">${card.category}</span>
              </div>
              <div class="card-main-title">${card.title}</div>
            </div>
            <div class="card-badge-right">${card.badge_tag || 'iPAS 核心考點'}</div>
          </div>

          <!-- Body Wrapper -->
          <div class="card-body-wrapper">
            <!-- Sidebar -->
            <div class="card-sidebar">
              <div>
                <div class="sidebar-desc">${card.desc}</div>
                
                <div style="font-size:12px; font-weight:700; color:#38bdf8; margin-bottom:8px;">🔑 關鍵詞標籤</div>
                <div class="capsule-grid">${capsulesHTML}</div>

                <div class="sidebar-checklist">
                  <div class="checklist-head">🎯 學習與考試 Checkpoint</div>
                  ${checklistHTML}
                </div>
              </div>

              <div>
                <div class="sidebar-flow">🔄 核心流程：${card.flow ? card.flow[0] : '觀念對齊 ➔ 機制理解 ➔ 題目秒解'}</div>
              </div>
            </div>

            <!-- 6 Grid Blocks -->
            <div class="card-grid-6">
              ${blocksHTML}
            </div>
          </div>
        </div>
      `;
    }

    // 啟動預設載入初級資料
    loadLevelData('junior');
  </script>
</body>
</html>
