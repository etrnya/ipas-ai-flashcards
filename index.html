<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPAS AI 應用規劃師（初級）考點精華圖卡庫</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@600;700;800&display=swap');
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Noto Sans TC', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 頂部 Header & 導覽列 */
    header {
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 20px;
    }

    .top-nav {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-badge {
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 14px;
      padding: 4px 10px;
      border-radius: 8px;
    }

    .app-title {
      font-size: 18px;
      font-weight: 900;
      background: linear-gradient(90deg, #38bdf8 0%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* 控制控制項 (搜尋 + 篩選 + 模式) */
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .search-input {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      outline: none;
      width: 200px;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
      width: 240px;
    }

    .category-select {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #38bdf8;
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }

    .btn-toggle {
      background: #334155;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-toggle:hover {
      background: #475569;
    }

    /* 主要容器 */
    main {
      max-width: 1400px;
      margin: 20px auto;
      padding: 0 16px;
      flex: 1;
      width: 100%;
    }

    /* 切換進度資訊條 */
    .progress-bar-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      background: rgba(30, 41, 59, 0.5);
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .card-counter {
      font-size: 14px;
      font-weight: 700;
      color: #38bdf8;
    }

    .nav-buttons {
      display: flex;
      gap: 8px;
    }

    .btn-nav {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-nav:disabled {
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
    }

    /* 圖卡容器 (RWD 設計) */
    .card-display-area {
      display: flex;
      justify-content: center;
    }

    /* 圖卡視覺樣式 (基於高密度 Bento Grid 白底清爽版) */
    .bento-card {
      background: #ffffff;
      color: #1e293b;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 1350px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
      border: 1px solid #cbd5e1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 頂層 Header */
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .card-id-tag {
      background: #0284c7;
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 14px;
      padding: 4px 12px;
      border-radius: 20px;
    }

    .card-category-tag {
      background: #f1f5f9;
      color: #334155;
      font-size: 13px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid #cbd5e1;
    }

    .card-main-title {
      font-size: 22px;
      font-weight: 900;
      color: #0f172a;
    }

    /* 桌面版 Layout: 左側 Sidebar + 右側 6 區塊 Grid */
    .card-body-wrapper {
      display: flex;
      gap: 16px;
    }

    /* 左側 Sidebar */
    .card-sidebar {
      width: 300px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .sidebar-desc {
      font-size: 13px;
      color: #475569;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .sidebar-checklist {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 12px;
    }

    .checklist-head {
      font-size: 12px;
      font-weight: 800;
      color: #166534;
      margin-bottom: 6px;
    }

    .checklist-row {
      font-size: 12px;
      color: #15803d;
      margin-bottom: 4px;
      display: flex;
      align-items: flex-start;
      gap: 4px;
    }

    .sidebar-flow {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 8px;
      font-size: 11px;
      font-weight: 700;
      color: #334155;
      text-align: center;
    }

    /* 右側 6 區塊 Grid */
    .card-grid-6 {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 12px;
    }

    .grid-block {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .block-head {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .block-badge-num {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .num-1 { background: #10b981; }
    .num-2 { background: #3b82f6; }
    .num-3 { background: #6366f1; }
    .num-4 { background: #ef4444; }
    .num-5 { background: #06b6d4; }
    .num-6 { background: #f59e0b; }

    .block-h-title {
      font-size: 14px;
      font-weight: 800;
      color: #0f172a;
    }

    .block-h-sub {
      font-size: 11px;
      color: #64748b;
      margin-bottom: 6px;
    }

    /* 清單與表格 */
    .block-list-item {
      font-size: 12px;
      color: #334155;
      margin-bottom: 4px;
      line-height: 1.4;
    }

    .ui-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
      margin-top: 4px;
    }

    .ui-table th {
      background: #e2e8f0;
      color: #1e293b;
      padding: 4px;
      text-align: left;
      font-weight: 700;
    }

    .ui-table td {
      padding: 4px;
      border: 1px solid #e2e8f0;
    }

    .block-focus-box {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-left: 3px solid #0284c7;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 700;
      color: #0f172a;
      border-radius: 4px;
      margin-top: 6px;
    }

    /* 底部三大總結 */
    .card-footer-summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .f-box {
      border-radius: 10px;
      padding: 10px 12px;
    }

    .f-summary { background: #fefce8; border: 1px solid #fef08a; }
    .f-strategy { background: #f5f3ff; border: 1px solid #ddd6fe; }
    .f-mnemonic { background: #fff1f2; border: 1px solid #fecdd3; }

    .f-title {
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 2px;
    }

    .t-summary { color: #854d0e; }
    .t-strategy { color: #5b21b6; }
    .t-mnemonic { color: #9f1239; }

    .f-desc {
      font-size: 12px;
      color: #334155;
      line-height: 1.4;
      font-weight: 600;
    }

    /* 手機 RWD 響應式優化 */
    @media (max-width: 900px) {
      .card-body-wrapper {
        flex-direction: column;
      }

      .card-sidebar {
        width: 100%;
      }

      .card-grid-6 {
        grid-template-columns: 1fr;
        grid-template-rows: auto;
      }

      .card-footer-summary {
        grid-template-columns: 1fr;
      }

      .search-input {
        width: 100%;
      }

      .search-input:focus {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- 頂部 Header -->
  <header>
    <div class="top-nav">
      <div class="logo-area">
        <span class="logo-badge">iPAS AI 初級</span>
        <span class="app-title">考點精華圖卡線上記憶庫</span>
      </div>

      <div class="controls">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 搜尋關鍵字 (如 RAG, SVM)...">
        
        <select id="categorySelect" class="category-select">
          <option value="ALL">📚 所有單元 (22張)</option>
          <option value="L111">L111 人工智慧概念</option>
          <option value="L112">L112 機器學習基礎</option>
          <option value="L113">L113 深度學習與模型</option>
          <option value="L114">L114 AI 倫理與法規</option>
          <option value="L121">L121 生成式 AI 與 RAG</option>
          <option value="L122">L122 企業 AI 導入</option>
          <option value="L123">L123 GenAI 工具落地</option>
        </select>
      </div>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main>
    <!-- 導覽進度條 -->
    <div class="progress-bar-area">
      <div class="card-counter" id="cardCounter">正在載入圖卡...</div>
      <div class="nav-buttons">
        <button class="btn-nav" id="btnPrev" onclick="prevCard()">⬅️ 上一張</button>
        <button class="btn-nav" id="btnNext" onclick="nextCard()">下一張 ➡️</button>
      </div>
    </div>

    <!-- 單張圖卡顯示區域 -->
    <div class="card-display-area" id="cardContainer">
      <!-- JavaScript 將動態渲染 Bento Card -->
    </div>
  </main>

  <script>
    let allCards = [];
    let filteredCards = [];
    let currentIndex = 0;

    // 載入 JSON 資料
    fetch('junior_cards_data.json')
      .then(res => res.json())
      .then(data => {
        allCards = data;
        filteredCards = [...allCards];
        renderCurrentCard();
      })
      .catch(err => {
        console.error('Error loading cards:', err);
        document.getElementById('cardContainer').innerHTML = '<div style="color:#ef4444; padding:40px;">⚠️ 無法載入圖卡資料庫 junior_cards_data.json</div>';
      });

    // 搜尋與篩選監聽
    document.getElementById('searchInput').addEventListener('input', filterCards);
    document.getElementById('categorySelect').addEventListener('change', filterCards);

    function filterCards() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const cat = document.getElementById('categorySelect').value;

      filteredCards = allCards.filter(card => {
        const matchSearch = card.title.toLowerCase().includes(search) || 
                            card.category.toLowerCase().includes(search) ||
                            card.summary.toLowerCase().includes(search) ||
                            card.mnemonic.toLowerCase().includes(search);
        const matchCat = (cat === 'ALL') || card.category.includes(cat);
        return matchSearch && matchCat;
      });

      currentIndex = 0;
      renderCurrentCard();
    }

    function prevCard() {
      if (currentIndex > 0) {
        currentIndex--;
        renderCurrentCard();
      }
    }

    function nextCard() {
      if (currentIndex < filteredCards.length - 1) {
        currentIndex++;
        renderCurrentCard();
      }
    }

    function renderCurrentCard() {
      const container = document.getElementById('cardContainer');
      const counter = document.getElementById('cardCounter');
      const btnPrev = document.getElementById('btnPrev');
      const btnNext = document.getElementById('btnNext');

      if (filteredCards.length === 0) {
        container.innerHTML = '<div style="color:#94a3b8; padding:40px; text-align:center;">🔍 沒有找到符合條件的圖卡</div>';
        counter.innerText = '0 / 0';
        btnPrev.disabled = true;
        btnNext.disabled = true;
        return;
      }

      const card = filteredCards[currentIndex];
      counter.innerText = `圖卡 ${currentIndex + 1} / ${filteredCards.length} (${card.id})`;
      btnPrev.disabled = (currentIndex === 0);
      btnNext.disabled = (currentIndex === filteredCards.length - 1);

      // 構建 6 區塊 HTML
      let blocksHTML = '';
      card.bento_blocks.forEach(block => {
        let contentHTML = '';
        if (block.type === 'table') {
          let headersHTML = block.headers.map(h => `<th>${h}</th>`).join('');
          let rowsHTML = block.rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('');
          contentHTML = `<table class="ui-table"><thead><tr>${headersHTML}</tr></thead><tbody>${rowsHTML}</tbody></table>`;
        } else {
          contentHTML = block.items.map(item => `<div class="block-list-item">${item}</div>`).join('');
        }

        blocksHTML += `
          <div class="grid-block">
            <div>
              <div class="block-head">
                <span class="block-badge-num ${block.color}">${block.num}</span>
                <span class="block-h-title">${block.title}</span>
              </div>
              <div class="block-h-sub">${block.sub}</div>
              ${contentHTML}
            </div>
            <div class="block-focus-box">${block.focus}</div>
          </div>
        `;
      });

      // 構建 Checklist HTML
      let checklistHTML = card.checklist.map(c => `<div class="checklist-row">✓ ${c}</div>`).join('');

      container.innerHTML = `
        <div class="bento-card">
          <!-- Top Header -->
          <div class="card-top">
            <div style="display:flex; align-items:center; gap:8px;">
              <span class="card-id-tag">${card.id}</span>
              <span class="card-category-tag">${card.category}</span>
            </div>
            <div class="card-main-title">${card.title}</div>
            <div style="font-size:12px; color:#64748b; font-weight:700;">iPAS AI 初級考點精華</div>
          </div>

          <!-- Body Wrapper -->
          <div class="card-body-wrapper">
            <!-- Sidebar -->
            <div class="card-sidebar">
              <div>
                <div class="sidebar-desc">${card.desc}</div>
                <div class="sidebar-checklist">
                  <div class="checklist-head">🎯 學習與考試重點</div>
                  ${checklistHTML}
                </div>
              </div>
              <div>
                <div class="sidebar-flow">🔄 流程：${card.flow[0]}</div>
              </div>
            </div>

            <!-- 6 Grid Blocks -->
            <div class="card-grid-6">
              ${blocksHTML}
            </div>
          </div>

          <!-- Footer 3 Summary -->
          <div class="card-footer-summary">
            <div class="f-box f-summary">
              <div class="f-title t-summary">💡 總結重點</div>
              <div class="f-desc">${card.summary}</div>
            </div>
            <div class="f-box f-strategy">
              <div class="f-title t-strategy">🎓 考試攻略</div>
              <div class="f-desc">${card.strategy}</div>
            </div>
            <div class="f-box f-mnemonic">
              <div class="f-title t-mnemonic">🎯 快速記憶口訣</div>
              <div class="f-desc">${card.mnemonic}</div>
            </div>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
